name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Xcode 27 is the first whose `swift build` compiles String Catalogs; older ones only copy them
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: swift test
